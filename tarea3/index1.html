<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de reserva para un viaje a la Luna</title>
</head>

<body>
    <form action="/procesar.php" method="post">
        <fieldset>
            <legend>Datos del viajero</legend>
            <label for="name">Nombre completo</label>
            <input type="text" id="name" name="name" required>
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" required>
            <label for="phone">Telefono</label>
            <input type="number" id="phone" name="phone" pattern="[0-9]{9}">
            <label for="year_of_birth">Fecha de nacimiento</label>
            <input type="date" id="year_of_birth" name="year_of_birth" required max="2008-10-13">
            <label for="password">Contraseña</label>
            <input type="password" minlength="8">
           
        </fieldset>
        <fieldset>
            <legend>Datos del viaje</legend>
  <label for="launch_date">Fecha de despegue</label>
            <input type="date" id="launch_date" name="launch_date" required min="2026-10-14">
                        <label for="email">Correo</label>
            <input type="email" id="email" name="email" required>
        </fieldset>
         <button type="submit">Enviar</button>
    </form>
</body>

</html>
