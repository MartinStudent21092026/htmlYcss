<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de reserva para un viaje a la Luna</title>
  </head>

  <body>
    <form action="/procesar.php" method="post">
      <fieldset>
        <legend>Datos del viajero/a</legend>
        <label for="name">Nombre completo</label>
        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="Introduce tu nombre"
        />
        <label for="email">Correo</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="Introduce tu correo"
        />
        <label for="phone">Telefono</label>
        <input
          type="text"
          id="phone"
          name="phone"
          pattern="[0-9]{9}"
          required
          placeholder="Introduce tu numero"
        />
        <label for="year_of_birth">Fecha de nacimiento</label>
        <input
          type="date"
          id="year_of_birth"
          name="year_of_birth"
          required
          max="2008-10-13"
        />
        <label for="password">Contraseña</label>
        <input
          type="password"
          minlength="8"
          required
          id="password"
          placeholder="Introduce tu contraseña"
        />
      </fieldset>
      <fieldset>
        <legend>Datos del viaje</legend>
        <label for="launch_date">Fecha de despegue</label>
        <input
          type="date"
          id="launch_date"
          name="launch_date"
          required
          min="2026-10-14"
        />
        <label for="number_of_passenger"> Numero de pasajeros</label>
        <input
          type="number"
          id="number_of_passenger"
          name="number_of_passenger"
          min="1"
          max="4"
          value="1"
        />
        <label for="cabin_class">Clase de cabina</label>
        <select name="cabin_class" id="cabin_class">
          <option value="economy">Económica</option>
          <option value="business">Business</option>
          <option value="suite_with_view">Suite con vistas</option>
        </select>

        <fieldset>
          <legend>Tipo de traje espacial</legend>
          <input
            type="radio"
            name="type_of_spacesuit"
            id="classic"
            value="classic"
          />
          <label for="classic">Clasico</label>
          <input
            type="radio"
            name="type_of_spacesuit"
            id="light"
            value="light"
          />
          <label for="light">Ligero</label>
          <input
            type="radio"
            name="type_of_spacesuit"
            id="premium"
            value="premium"
          />
          <label for="premium">Premiun</label>
        </fieldset>
        <br />
        <label for="destination"> Destino del paseo lunar: </label>
        <input list="destinations" name="destination" id="destination" />
        <datalist id="destinations">
          <option value="Mar de la tranquilidad"></option>
          <option value="Cráter lunar central"></option>
        </datalist>
      </fieldset>
      <fieldset>
        <legend>Extras y preferencias</legend>
        <fieldset>
          <legend>Servicios extra</legend>
          <label for="gourmet_food">Comida gourmet</label>
          <input
            type="checkbox"
            name="extra_service"
            id="gourmet_food"
            value="gourmet_food"
          />
          <label for="photo_with_earth">foto con la Tierra de fondo</label>
          <input
            type="checkbox"
            name="extra_service"
            value="photo_with_earth"
            id="photo_with_earth"
          />
          <label for="meteorite_insurance">seguro de meteoritos</label>
          <input
            type="checkbox"
            name="extra_service"
            value="meteorite_insurance"
            id="meteorite_insurance"
          />
          <label for="souvenirs">Souvenirs</label>
          <input
            type="checkbox"
            name="extra_service"
            value="souvenirs"
            id="souvenirs"
          />
        </fieldset>

        <label for="level_of_fear">Nivel de miedo a las alturas</label>

        <input type="range" min="0" max="10" value="0" id="level_of_fear" />
        <label for="commit">Comentarios</label>
        <textarea name="commit" id="commit"></textarea>
        <label for="accept_conditions">Acepto las condiciones </label>
        <input
          type="checkbox"
          name="accept_conditions"
          id="accept_conditions"
          value="accept"
          required
        />
      </fieldset>
      <br />
      <button type="submit">Reserva mi plaza</button>
      <button type="reset">Empezar de nuevo</button>
    </form>
  </body>
</html>
